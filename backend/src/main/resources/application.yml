server:
  port: 8080

spring:
  application:
    name: cveille-backend
  main:
    banner-mode: console

cveille:
  # Rolling window for CVE fetch (default: last 48 hours to account for NVD publishing delays)
  window-hours: 48

  # Target storage paths (relative to backend directory or overridden by env)
  data-dir: ${CVEILLE_DATA_DIR:../data}
  frontend-dir: ${CVEILLE_FRONTEND_DIR:../frontend}
  readme-path: ${CVEILLE_README_PATH:../README.md}

  # Retention policy for daily archives in data/
  retention:
    max-daily-files: 15

  # Monitored Enterprise Stack (Spring Boot + Angular + Infrastructure)
  stack:
    keywords:
      # Java / Spring Boot ecosystem
      - spring
      - spring-boot
      - spring-security
      - spring-framework
      - spring-cloud
      - tomcat
      - hibernate
      - jackson
      - log4j
      - logback
      # Angular / Frontend ecosystem
      - angular
      - typescript
      - rxjs
      - ngrx
      - node.js
      - npm
      # Enterprise Infrastructure & Services
      - docker
      - kubernetes
      - postgresql
      - nginx
      - keycloak

  # Alert criteria for high-risk vulnerabilities
  alert:
    min-cvss: 7.5
    alert-on-kev: true
    min-epss: 0.20

  # Threat Intel Feeds & Rate Limits
  nvd:
    api-url: https://services.nvd.nist.gov/rest/json/cves/2.0
    api-key: ${NVD_API_KEY:}
    page-size: 200
    max-retries: 3
    retry-delay-ms: 3000

  cisa-kev:
    feed-url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json

  epss:
    api-url: https://api.first.org/data/v1/epss
    batch-size: 80
